name: Generate Chapter 05 Images

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_chapter05_images.py'
      - '.github/workflows/generate-chapter05-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and Korean font
        run: |
          python -m pip install --upgrade pip
          pip install pillow
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Generate JPG images
        run: python scripts/generate_chapter05_images.py

      - name: Commit generated images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/chapter05/*.jpg
          if git diff --cached --quiet; then
            echo 'No image changes.'
            exit 0
          fi
          git commit -m 'assets: generate Chapter 05 blog images'
          git push
