name: Normalize Worksheet Links

on:
  push:
    paths:
      - "scripts/normalize_worksheet_links.py"
      - ".github/workflows/normalize-worksheet-links.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize worksheet links
        run: python scripts/normalize_worksheet_links.py

      - name: Commit normalized links
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md COURSE_GUIDE.md
          git commit -m "docs: link session worksheets from student guides"
          git push
