name: Generate Chapter 09 Images

on:
  push:
    paths:
      - 'scripts/generate_chapter09_images.py'
      - '.github/workflows/generate-chapter09-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and Korean font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install pillow

      - name: Generate JPG images
        run: python scripts/generate_chapter09_images.py

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/chapter09/*.jpg
          git diff --cached --quiet && exit 0
          git commit -m "assets: generate Chapter 09 images"
          git push
